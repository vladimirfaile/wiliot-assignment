apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  labels:
    app: producer
spec:
  # One WebSocket is enough for 10 symbols; a second replica would only
  # duplicate every trade (harmless, the consumer upserts, but wasteful).
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: producer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Start the new pod first and keep the old one until the new one is
      # Ready (= streaming from Binance): no ingest gap during a deploy.
      # The brief overlap produces duplicates, which the consumer ignores.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: producer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: producer
      nodeSelector:
        workload: apps
      # Node failure: by default a pod stays bound to a NotReady/unreachable node
      # for 300s before eviction (~6 min gap with ~45s detection + startup).
      # 30s brings that to ~1.5 min. Flapping risk is acceptable: a pod that
      # was still alive would only stream in parallel briefly, and the consumer
      # drops the duplicate trades.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      # Covers producer.flush(30) on SIGTERM.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: producer
          image: producer
          envFrom:
            - configMapRef:
                name: producer-config
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
